name: Build BLCKBOLT-BROWSER

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies from package.json
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Generate resolved lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Runtime dependency security audit
        run: npm run security:audit
      - name: Full dependency audit report
        shell: bash
        run: |
          npm run security:audit:full > audit-${{ matrix.os }}.txt 2>&1 || true
      - name: Build and package
        run: npm run build:prod
      - name: Upload distributables
        uses: actions/upload-artifact@v7
        with:
          name: blckbolt-build-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: blckbolt-lock-${{ matrix.os }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload security audit report
        uses: actions/upload-artifact@v7
        with:
          name: blckbolt-audit-${{ matrix.os }}
          path: audit-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 14
