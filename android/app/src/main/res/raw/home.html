<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLCKBOLT</title>
<style>
  html, body { height: 100%; margin: 0; background: #1a1a1a; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .logo { width: 84px; height: 84px; border-radius: 18px; background: #222;
    border: 2px solid #ffd600; display: flex; align-items: center; justify-content: center; }
  .bolt { width: 40px; height: 52px; }
  h1 { font-size: 26px; letter-spacing: 3px; margin: 18px 0 6px; font-weight: 700; }
  p.tag { margin: 0 0 28px; color: #9e9e9e; font-size: 13px; }
  form { width: 100%; max-width: 560px; display: flex; }
  input[type=search] { flex: 1; padding: 14px 18px; font-size: 16px; color: #fff;
    background: #333; border: 1px solid #444; border-radius: 26px 0 0 26px; outline: none; }
  button { padding: 14px 22px; font-size: 16px; font-weight: 600; color: #000;
    background: #ffd600; border: none; border-radius: 0 26px 26px 0; cursor: pointer; }
  p.note { margin-top: 18px; color: #616161; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg class="bolt" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 8 L40 32 H28 L36 56 L24 32 H36 Z" fill="#FFD600" stroke="#FFF" stroke-width="2"/>
    </svg>
  </div>
  <h1>BLCKBOLT</h1>
  <p class="tag">Private by design</p>
  <form action="https://duckduckgo.com/" method="get" autocomplete="off">
    <input type="search" name="q" placeholder="Search privately with DuckDuckGo" autofocus>
    <button type="submit">Search</button>
  </form>
  <p class="note">HTTPS-first &middot; third-party cookies blocked &middot; no tracking</p>
</div>
</body>
</html>
