<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cannot load page</title>
<style>
  html, body { height: 100%; margin: 0; background: #1a1a1a; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
  .code { width: 72px; height: 72px; border-radius: 16px; background: #222;
    border: 2px solid #ffd600; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; color: #ffd600; }
  h1 { font-size: 20px; margin: 18px 0 6px; }
  p { color: #9e9e9e; font-size: 14px; margin: 4px 16px; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">!</div>
  <h1>This page can&rsquo;t be loaded</h1>
  <p id="detail">The site may be down, unreachable, or refused a secure connection.</p>
</div>
</body>
</html>
